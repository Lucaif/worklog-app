// ── Utils ─────────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2, 9); }
function toMin(s) { if (!s) return 0; var p = s.split(":"); return parseInt(p[0]) * 60 + parseInt(p[1]); }
function nowTime() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function pad(n) { return String(n).padStart(2, "0"); }
function todayStr() { return new Date().toISOString().split("T")[0]; }
function getLocale(lang) { return lang === "en" ? "en-GB" : lang === "de" ? "de-DE" : "es-ES"; }
function fmtDate(s, lang) { try { return new Date(s + "T12:00:00").toLocaleDateString(getLocale(lang), {weekday:"long",day:"numeric",month:"long"}); } catch(e) { return s; } }
function fmtDateShort(s, lang) { try { return new Date(s + "T12:00:00").toLocaleDateString(getLocale(lang), {weekday:"short",day:"numeric",month:"short"}); } catch(e) { return s; } }
function fmtDur(min) { if (min == null || min < 0) return "--"; return Math.floor(min/60) + "h " + pad(min%60) + "m"; }
function fmtH(min) { return Math.round(min/60) + "h"; }
function getDayStatus(day) {
  if (!day || !day.workStart) return "idle";
  if (day.workEnd) return "complete";
  if (day.lunchEnd) return "resumed";
  if (day.lunchStart) return "lunch";
  // pauses: array of {start, end}
  var pauses = day.pauses || [];
  var lastPause = pauses[pauses.length - 1];
  if (lastPause && !lastPause.end) return "paused";
  return "working";
}
function calcBreakdown(day, s) {
  if (!day || !day.workStart || !day.workEnd) return null;
  var gross = toMin(day.workEnd) - toMin(day.workStart);
  if (gross < 0) gross += 1440; // crossed midnight
  if (gross < 0) gross = 0;
  // deduct completed pauses
  var pauses = day.pauses || [];
  var pausedMin = 0;
  pauses.forEach(function(p) {
    if (p.start && p.end) {
      var d = toMin(p.end) - toMin(p.start);
      if (d < 0) d += 1440;
      if (d > 0) pausedMin += d;
    }
  });
  var net = Math.max(0, gross - pausedMin);
  var nm = (s.workdayHours || 10) * 60;
  var normal = Math.min(net, nm);
  var extra = Math.max(0, net - nm);
  var bonus = day.applyLunchPenalty === true ? (s.lunchPenaltyH || 1) * 60 : 0;
  return { gross:gross, pausedMin:pausedMin, net:net, normal:normal, extra:extra, bonus:bonus, total:net+bonus };
}

// ── Storage ───────────────────────────────────────────────────────────────────
var DATA_KEY = "wt-data";
var SETT_KEY = "wt-settings";
var DEF_DATA = { projects: [] };
var DEF_SETT = { lang:"es", workdayHours:10, lunchPenaltyH:1, fullName:"" };

function stSave(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }
function stLoad(key, def) { try { var v = localStorage.getItem(key); return v ? Object.assign({}, def, JSON.parse(v)) : def; } catch(e) { return def; } }

// ── State ─────────────────────────────────────────────────────────────────────
var S = {
  data: stLoad(DATA_KEY, DEF_DATA),
  settings: stLoad(SETT_KEY, DEF_SETT),
  view: "projects",
  activeProjId: null,
  editDay: null,
  showNewProj: false,
  newProjName: "",
  confirmDelete: null,
  renameProj: null,
  commentDay: null,   // { projId, dayId, text }
  draftSett: null,
  importMsg: null,
  clock: nowTime()
};

function set(patch) {
  Object.assign(S, patch);
  render();
}
function persist(data) { S.data = data; stSave(DATA_KEY, data); }
function persistSett(sett) { S.settings = sett; stSave(SETT_KEY, sett); }

setInterval(function() { S.clock = nowTime(); render(); }, 15000);

// ── DOM helpers ───────────────────────────────────────────────────────────────
function el(tag, attrs, children) {
  var node = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      var v = attrs[k];
      if (k === "style") { Object.assign(node.style, v); }
      else if (k === "class") { node.className = v; }
      else if (k === "onClick") { node.addEventListener("click", v); }
      else if (k === "onChange") { node.addEventListener("change", v); }
      else if (k === "onInput") { node.addEventListener("input", v); }
      else if (k === "onKeyDown") { node.addEventListener("keydown", v); }
      else { node[k] = v; }
    });
  }
  if (children) {
    (Array.isArray(children) ? children : [children]).forEach(function(c) {
      if (c == null) return;
      node.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
    });
  }
  return node;
}
function div(a, c) { return el("div", a, c); }
function span(a, c) { return el("span", a, c); }
function btn(a, c) { return el("button", a, c); }
function inp(a) { return el("input", a); }
function txt(s) { return document.createTextNode(String(s)); }

function lbl(text) {
  return span({"class":"lbl"}, [text]);
}

function Btn(cls, text, onClick, extraStyle) {
  var b = btn({"class":"btn btn-"+cls, "onClick":onClick}, [text]);
  if (extraStyle) Object.assign(b.style, extraStyle);
  return b;
}

function Badge(status, t) {
  var cfg = {
    idle:     [t.statusIdle,     "rgba(238,238,245,0.38)", "rgba(238,238,245,0.05)"],
    working:  [t.statusWorking,  "#5ED5B7",                "rgba(94,213,183,0.1)"],
    lunch:    [t.statusLunch,    "#FFB547",                "rgba(255,181,71,0.1)"],
    resumed:  [t.statusResumed,  "#5ED5B7",                "rgba(94,213,183,0.1)"],
    paused:   [t.statusPaused,   "#FFB547",                "rgba(255,181,71,0.1)"],
    complete: [t.statusComplete, "#4DFF8A",                "rgba(77,255,138,0.1)"]
  }[status] || [status, "rgba(238,238,245,0.38)", "transparent"];
  return span({"class":"badge", style:{background:cfg[2],color:cfg[1]}}, [cfg[0]]);
}

function Chip(label, value, color, bg) {
  if (!value) return null;
  var c = div({"class":"chip", style:{background:bg||"rgba(255,255,255,0.05)"}});
  c.appendChild(div({"class":"chip-l"}, [label]));
  c.appendChild(div({"class":"chip-v", style:{color:color||"#EEEEF5"}}, [value]));
  return c;
}

function Stepper(val, onMinus, onPlus) {
  var row = div({"class":"stepper"});
  row.appendChild(btn({"class":"stepper-btn","onClick":onMinus}, ["-"]));
  row.appendChild(div({"class":"stepper-val"}, [String(val)]));
  row.appendChild(btn({"class":"stepper-btn","onClick":onPlus}, ["+"]));
  return row;
}

function BreakdownEl(bk, t, settings) {
  if (!bk) return null;
  var wrap = div({style:{background:"rgba(0,0,0,0.25)",borderRadius:"12px",border:"1px solid rgba(255,255,255,0.07)",overflow:"hidden",marginTop:"10px"}});
  wrap.appendChild(div({style:{padding:"10px 14px 6px"}}, [lbl(t.hoursBreakdown)]));
  var tbl = el("table");
  var tb = el("tbody");
  var rows = [
    [t.normalHours,  fmtDur(bk.normal), "#5ED5B7",  false],
    [t.overtime,     bk.extra>0 ? fmtDur(bk.extra) : "--", "#FF5C3A", false],
    [t.pausedTime,   bk.pausedMin>0 ? "−"+fmtDur(bk.pausedMin) : "--", "#FFB547", false],
    [t.noLunchBonus+" (+"+settings.lunchPenaltyH+"h)", bk.bonus>0 ? "+"+fmtH(bk.bonus) : "--", "#A78BFF", false],
    [t.net,          fmtDur(bk.total),    "#EEEEF5",  true]
  ];
  rows.forEach(function(row) {
    var tr = el("tr");
    var td1 = el("td", {style:{color:"rgba(238,238,245,0.62)",fontWeight:row[3]?"700":"400"}}, [row[0]]);
    var td2 = el("td", {style:{fontFamily:"'JetBrains Mono',monospace",fontWeight:"700",color:row[2],textAlign:"right",fontSize:row[3]?"16px":"14px"}}, [row[1]]);
    tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
  });
  tbl.appendChild(tb); wrap.appendChild(tbl);
  return wrap;
}

// ── Upsert day ────────────────────────────────────────────────────────────────
function upsertDay(projId, day) {
  var nd = Object.assign({}, S.data, {
    projects: S.data.projects.map(function(p) {
      if (p.id !== projId) return p;
      var exists = p.days.some(function(d) { return d.id === day.id; });
      return Object.assign({}, p, {
        days: exists ? p.days.map(function(d) { return d.id === day.id ? day : d; }) : p.days.concat([day])
      });
    })
  });
  persist(nd);
  render();
}

function tapAction(action) {
  var proj = S.data.projects.find(function(p) { return p.id === S.activeProjId; });
  if (!proj) return;
  var time = nowTime(), today = todayStr();
  var existing = proj.days.find(function(d) { return d.date === today; });
  var base = existing || { id:uid(), date:today, workStart:null, lunchStart:null, lunchEnd:null, workEnd:null, pauses:[] };
  var day = Object.assign({}, base, {pauses: (base.pauses || []).slice()});

  if (action === "pause") {
    day.pauses.push({start: time, end: null});
  } else if (action === "resumePause") {
    var last = day.pauses[day.pauses.length - 1];
    if (last && !last.end) {
      day.pauses[day.pauses.length - 1] = Object.assign({}, last, {end: time});
    }
  } else {
    var upd = {start:{workStart:time},lunch:{lunchStart:time},resume:{lunchEnd:time},end:{workEnd:time}}[action] || {};
    Object.assign(day, upd);
  }
  upsertDay(proj.id, day);
}

function generateReportText(proj, settings) {
  var t = LANGS[settings.lang] || LANGS.es;
  var locale = getLocale(settings.lang);
  var days = proj.days.filter(function(d){return d.workStart;}).sort(function(a,b){return a.date.localeCompare(b.date);});
  var bks = days.map(function(d){return calcBreakdown(d,settings);});
  var totNet = 0, totNormal = 0, totExtra = 0, totBonus = 0;
  bks.forEach(function(b){if(b){totNet+=b.total;totNormal+=b.normal;totExtra+=b.extra;totBonus+=b.bonus;}});

  var lines = [];
  if (settings.fullName) lines.push(settings.fullName);
  lines.push(proj.name);
  lines.push("");
  lines.push("─".repeat(36));

  days.forEach(function(day, i) {
    var bk = bks[i];
    var dateStr = new Date(day.date+"T12:00:00").toLocaleDateString(locale, {weekday:"long",day:"numeric",month:"long",year:"numeric"});
    lines.push("");
    lines.push(dateStr.charAt(0).toUpperCase() + dateStr.slice(1));
    lines.push("  Entrada:  " + (day.workStart || "--"));
    lines.push("  Salida:   " + (day.workEnd   || "--"));
    if (day.lunchStart) lines.push("  Comida:   " + day.lunchStart + " – " + (day.lunchEnd||"?"));
    var pauses = day.pauses || [];
    var completedPauses = pauses.filter(function(p){return p.start && p.end;});
    if (completedPauses.length > 0) {
      completedPauses.forEach(function(p, pi) {
        lines.push("  Pausa "+(pi+1)+":  " + p.start + " – " + p.end);
      });
    }
    if (day.applyLunchPenalty && settings.lunchPenaltyH > 0) {
      lines.push("  Penalty Lunch: +" + settings.lunchPenaltyH + "h");
    }
    if (bk) {
      lines.push("  ─────────────────────");
      lines.push("  Total:     " + fmtDur(bk.total));
    }
    if (day.comment) lines.push("  Nota: " + day.comment);
  });

  lines.push("");
  lines.push("─".repeat(36));
  lines.push("RESUMEN");
  lines.push("  Horas trabajadas: " + fmtDur(totNormal));
  if (totExtra > 0)  lines.push("  Horas extra:      " + fmtDur(totExtra));
  if (totBonus > 0)  lines.push("  Penalty Lunch:    +" + fmtH(totBonus));
  lines.push("  TOTAL:            " + fmtDur(totNet));
  lines.push("─".repeat(36));

  return lines.join("\n");
}

      var chips = div({style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"6px"}});
      var ch1=Chip("Entrada",day.workStart,"#EEEEF5","rgba(255,255,255,0.05)"); if(ch1) chips.appendChild(ch1);
      if (day.lunchStart) { var ch=Chip("Comida",day.lunchStart+"–"+(day.lunchEnd||"?"),"#FFB547","rgba(255,181,71,0.1)"); if(ch) chips.appendChild(ch); }
      var ch2=Chip("Salida",day.workEnd,"#5ED5B7","rgba(94,213,183,0.1)"); if(ch2) chips.appendChild(ch2);
      c.appendChild(chips);
      if (bk) { var bkEl=BreakdownEl(bk,t,S.settings); if(bkEl) c.appendChild(bkEl); }
      c.appendChild(div({style:{fontSize:"11px",color:"rgba(238,238,245,0.38)",marginTop:"8px",textAlign:"right"}}, [t.editTap+" →"]));
      sec.appendChild(c);
    });
  }
  root.appendChild(sec);
  return root;
}

function renderProject() {
  var t = LANGS[S.settings.lang] || LANGS.es;
  var proj = S.data.projects.find(function(p) { return p.id === S.activeProjId; });
  if (!proj) return renderProjects();
  var todayDay = proj.days.find(function(d) { return d.date === todayStr(); }) || null;
  var todaySt = getDayStatus(todayDay);
  var todayBK = calcBreakdown(todayDay, S.settings);
  var past = proj.days.filter(function(d) { return d.date !== todayStr(); }).sort(function(a,b) { return b.date.localeCompare(a.date); });
  var totalMin = proj.days.reduce(function(acc,d) { var b=calcBreakdown(d,S.settings); return acc+(b?b.total:0); }, 0);

  var root = div({"class":"app"});

  // Rename popup
  if (S.renameProj !== null) {
    var ov = div({"class":"overlay"});
    var pop = div({"class":"card popup"});
    pop.appendChild(el("div",{"class":"fd",style:{fontSize:"18px",marginBottom:"14px"}}, [t.rename]));
    var ri = inp({"class":"input-std", value:S.renameProj||"", style:{marginBottom:"14px"}});
    ri.addEventListener("input", function(e) { S.renameProj = e.target.value; });
    ri.addEventListener("keydown", function(e) {
      if (e.key==="Enter" && S.renameProj && S.renameProj.trim()) {
        persist(Object.assign({},S.data,{projects:S.data.projects.map(function(p){return p.id===proj.id?Object.assign({},p,{name:S.renameProj.trim()}):p;})}));
        set({renameProj:null});
      }
      if (e.key==="Escape") set({renameProj:null});
    });
    pop.appendChild(ri);
    var row = div({"class":"flex-row"});
    var sv = Btn("p", t.save, function() {
      if (!S.renameProj || !S.renameProj.trim()) return;
      persist(Object.assign({},S.data,{projects:S.data.projects.map(function(p){return p.id===proj.id?Object.assign({},p,{name:S.renameProj.trim()}):p;})}));
      set({renameProj:null});
    }, {flex:"1"});
    var ca = Btn("g", t.cancel, function() { set({renameProj:null}); }, {flex:"1"});
    row.appendChild(sv); row.appendChild(ca); pop.appendChild(row);
    ov.appendChild(pop); root.appendChild(ov);
    setTimeout(function(){ ri.focus(); }, 50);
  }

  renderCommentPopup(root);

  var hdr = div({"class":"hdr"});
  hdr.appendChild(Btn("g", t.backProjects, function() { set({view:"projects"}); }));
  var hdrRight = div({"class":"flex-row"});
  hdrRight.appendChild(Btn("g", "⚙", function() { set({view:"settings"}); }));
  var repBtn = Btn("g", t.report, function() { set({view:"report"}); });
  repBtn.style.color = "#FF5C3A"; repBtn.style.borderColor = "rgba(255,92,58,0.2)";
  hdrRight.appendChild(repBtn); hdr.appendChild(hdrRight); root.appendChild(hdr);

  var projHead = div({style:{padding:"0 20px 16px"}});
  var nameRow = div({style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"4px"}});
  nameRow.appendChild(el("h2",{"class":"fd",style:{fontSize:"26px",margin:"0"}}, [proj.name]));
  nameRow.appendChild(btn({style:{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:"8px",color:"rgba(238,238,245,0.62)",fontSize:"13px",cursor:"pointer",padding:"4px 9px",lineHeight:"1"},"onClick":function(){set({renameProj:proj.name});}},["✎"]));
  projHead.appendChild(nameRow);
  projHead.appendChild(lbl(proj.days.length+" "+t.days+" · "+fmtDur(totalMin)+" "+t.total.toLowerCase()));
  root.appendChild(projHead);

  var sec = div({"class":"sec"});
  var locale = S.settings.lang==="en"?"en-GB":S.settings.lang==="de"?"de-DE":"es-ES";
  var todayHeader = div({style:{marginBottom:"10px"}});
  todayHeader.appendChild(lbl(t.today+" · "+new Date().toLocaleDateString(locale,{day:"numeric",month:"long"})));
  sec.appendChild(todayHeader);

  var dayCard = div({"class":"card"+(todaySt!=="idle"?" card-on":"")});
  var clockRow = div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}});
  clockRow.appendChild(div({"class":"mono", style:{fontSize:"40px",letterSpacing:"-1px",lineHeight:"1"}}, [S.clock]));
  var badgeRow = div({style:{display:"flex",alignItems:"center",gap:"8px"}});
  badgeRow.appendChild(Badge(todaySt, t));
  if (todaySt !== "idle") {
    var editBtnEl = btn({style:{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:"8px",color:"rgba(238,238,245,0.62)",fontSize:"15px",cursor:"pointer",padding:"4px 9px",lineHeight:"1"},"onClick":function(){
      var base = todayDay || {id:uid(),date:todayStr(),workStart:null,lunchStart:null,lunchEnd:null,workEnd:null};
      set({editDay:Object.assign({},base,{_pid:proj.id,_isNew:!todayDay})});
    }}, [t.edit]);
    badgeRow.appendChild(editBtnEl);
  }
  clockRow.appendChild(badgeRow); dayCard.appendChild(clockRow);

  if (todayDay) {
    var chips = div({style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"12px"}});
    var c1=Chip("Entrada",todayDay.workStart); if(c1) chips.appendChild(c1);
    if (todayDay.lunchStart) { var c=Chip("Comida",todayDay.lunchStart+"–"+(todayDay.lunchEnd||"?"),"#FFB547","rgba(255,181,71,0.1)"); if(c) chips.appendChild(c); }
    if (todayDay.workEnd) { var c2=Chip("Salida",todayDay.workEnd,"#5ED5B7","rgba(94,213,183,0.1)"); if(c2) chips.appendChild(c2); }
    dayCard.appendChild(chips);
  }

  if (S.settings.lunchPenaltyH > 0 && todayDay) {
    var isChecked = todayDay.applyLunchPenalty === true;
    var cbRow = div({style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"14px",cursor:"pointer",userSelect:"none"},"onClick":function(){
      upsertDay(proj.id, Object.assign({},todayDay,{applyLunchPenalty:!isChecked}));
    }});
    var cbBox = div({"class":"cb-box",style:{border:"2px solid "+(isChecked?"#5ED5B7":"rgba(255,255,255,0.07)"),background:isChecked?"rgba(94,213,183,0.1)":"transparent"}});
    if (isChecked) cbBox.appendChild(span({style:{fontSize:"12px",color:"#5ED5B7"}}, ["✓"]));
    cbRow.appendChild(cbBox);
    cbRow.appendChild(span({style:{fontSize:"13px",color:isChecked?"#5ED5B7":"rgba(238,238,245,0.62)"}}, [t.applyPenalty+" (+"+S.settings.lunchPenaltyH+"h)"]));
    dayCard.appendChild(cbRow);
  }

  var actRow = div({"class":"flex-row", style:{flexWrap:"wrap"}});
  if (todaySt==="idle") { var b=Btn("p",t.start,function(){tapAction("start");},{flex:"1"}); actRow.appendChild(b); }
  if (todaySt==="working") {
    var b1=Btn("w",t.lunch,function(){tapAction("lunch");},{flex:"1"});
    var b2=Btn("w",t.pause,function(){tapAction("pause");},{flex:"1"});
    var b3=Btn("s",t.end,function(){tapAction("end");},{flex:"1"});
    actRow.appendChild(b1); actRow.appendChild(b2); actRow.appendChild(b3);
  }
  if (todaySt==="lunch") { var b=Btn("t",t.resume,function(){tapAction("resume");},{flex:"1"}); actRow.appendChild(b); }
  if (todaySt==="paused") { var b=Btn("t",t.resumeWork,function(){tapAction("resumePause");},{flex:"1"}); actRow.appendChild(b); }
  if (todaySt==="resumed") { var b=Btn("s",t.end,function(){tapAction("end");},{flex:"1"}); actRow.appendChild(b); }
  if (todaySt==="complete") actRow.appendChild(div({style:{width:"100%",textAlign:"center",color:"rgba(238,238,245,0.38)",fontSize:"13px",marginTop:"4px"}}, [t.complete]));
  if (todayBK) {
    var hrs = div({style:{marginBottom:"12px",display:"flex",alignItems:"center",justifyContent:"space-between"}});
    var hrsLeft = div(null);
    hrsLeft.appendChild(lbl(t.workedToday+" · "));
    hrsLeft.appendChild(span({"class":"mono",style:{fontSize:"15px",color:"#5ED5B7"}}, [fmtDur(todayBK.normal)]));
    if (todayBK.extra>0) hrsLeft.appendChild(span({"class":"mono",style:{fontSize:"13px",color:"#FF5C3A",marginLeft:"8px"}}, ["+"+fmtDur(todayBK.extra)+" extra"]));
    if (todayBK.pausedMin>0) hrsLeft.appendChild(span({"class":"mono",style:{fontSize:"13px",color:"#FFB547",marginLeft:"8px"}}, ["−"+fmtDur(todayBK.pausedMin)+" pausa"]));
    if (todayBK.bonus>0) hrsLeft.appendChild(span({"class":"mono",style:{fontSize:"13px",color:"#A78BFF",marginLeft:"8px"}}, ["+"+fmtH(todayBK.bonus)+" Penalty Lunch"]));
    hrs.appendChild(hrsLeft);
    if (todayDay) hrs.appendChild(CommentBtn(proj.id, todayDay, t));
    dayCard.appendChild(hrs);
  } else if (todayDay && todaySt !== "idle") {
    var cmtRow = div({style:{marginBottom:"12px",display:"flex",justifyContent:"flex-end"}});
    cmtRow.appendChild(CommentBtn(proj.id, todayDay, t));
    dayCard.appendChild(cmtRow);
  }

  dayCard.appendChild(actRow);
  sec.appendChild(dayCard);

  var addBtn = Btn("g", t.addManual, function() {
    set({editDay:{id:uid(),date:"",workStart:null,lunchStart:null,lunchEnd:null,workEnd:null,_pid:proj.id,_isNew:true}});
  }, {width:"100%",fontSize:"13px"});
  sec.appendChild(addBtn);

  if (past.length > 0) {
    var pastSec = div({style:{padding:"24px 20px 0"}});
    pastSec.appendChild(div({style:{marginBottom:"12px"}}, [lbl(t.pastDays)]));
    past.forEach(function(day) {
      var bk = calcBreakdown(day, S.settings);
      var c = div({"class":"card",style:{cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}});
      c.addEventListener("click", function() { set({editDay:Object.assign({},day,{_pid:proj.id,_isNew:false})}); });
      var left = div(null);
      left.appendChild(div({style:{fontSize:"14px",fontWeight:"600",textTransform:"capitalize",marginBottom:"5px"}}, [fmtDateShort(day.date,S.settings.lang)]));
      left.appendChild(Badge(getDayStatus(day),t));
      var right = div({style:{textAlign:"right"}});
      right.appendChild(div({"class":"mono",style:{fontSize:"20px",color:bk?"#5ED5B7":"rgba(238,238,245,0.38)"}}, [bk?fmtDur(bk.total):"--"]));
      if (bk && bk.extra>0) right.appendChild(div({"class":"mono",style:{fontSize:"11px",color:"#FF5C3A"}}, ["+"+fmtDur(bk.extra)]));
      right.appendChild(div({style:{fontSize:"10px",color:"rgba(238,238,245,0.38)",marginTop:"2px"}}, ["editar →"]));
      if (day.comment) right.appendChild(span({style:{fontSize:"13px",color:"#A78BFF",display:"block",marginTop:"4px"}},["💬"]));
      c.appendChild(left); c.appendChild(right); pastSec.appendChild(c);
    });
    root.appendChild(sec); root.appendChild(pastSec);
    return root;
  }
  root.appendChild(sec);
  return root;
}

function renderProjects() {
  var t = LANGS[S.settings.lang] || LANGS.es;
  var root = div({"class":"app"});

  // Confirm delete overlay
  if (S.confirmDelete) {
    var ov = div({"class":"overlay"});
    var pop = div({"class":"card popup"});
    pop.appendChild(el("div",{"class":"fd",style:{fontSize:"18px",marginBottom:"8px"}},[t.deleteProject]));
    pop.appendChild(div({style:{color:"rgba(238,238,245,0.38)",fontSize:"14px",marginBottom:"20px"}},[t.deleteWarning]));
    var row = div({"class":"flex-row"});
    var id = S.confirmDelete;
    var db = Btn("d", t.delete, function() {
      var nd = Object.assign({},S.data,{projects:S.data.projects.filter(function(p){return p.id!==id;})});
      persist(nd);
      set({confirmDelete:null, activeProjId:S.activeProjId===id?null:S.activeProjId, view:S.activeProjId===id?"projects":S.view});
    }, {flex:"1"});
    var cb = Btn("g", t.cancel, function() { set({confirmDelete:null}); }, {flex:"1"});
    row.appendChild(db); row.appendChild(cb); pop.appendChild(row);
    ov.appendChild(pop); root.appendChild(ov);
  }

  var hdr = div({"class":"hdr",style:{flexDirection:"column",alignItems:"flex-start",paddingBottom:"16px"}});
  var hdrTop = div({style:{display:"flex",justifyContent:"space-between",alignItems:"flex-end",width:"100%"}});
  var hdrLeft = div(null);
  hdrLeft.appendChild(el("h1",{"class":"fd",style:{fontSize:"34px",margin:"0",letterSpacing:"-0.5px"}},[t.projects]));
  var setBtn = Btn("g","⚙",function(){set({view:"settings"});},{padding:"11px 15px",fontSize:"18px"});
  hdrTop.appendChild(hdrLeft); hdrTop.appendChild(setBtn); hdr.appendChild(hdrTop); root.appendChild(hdr);

  var sec = div({"class":"sec"});

  if (S.data.projects.length === 0 && !S.showNewProj) {
    var empty = div({style:{textAlign:"center",padding:"48px 0 32px",color:"rgba(238,238,245,0.38)"}});
    empty.appendChild(div({style:{fontSize:"44px",marginBottom:"12px"}},["⏱"]));
    empty.appendChild(div({style:{fontSize:"16px",fontWeight:"600",color:"rgba(238,238,245,0.62)",marginBottom:"6px"}},[t.noProjects]));
    empty.appendChild(div(null,[t.noProjectsHint]));
    sec.appendChild(empty);
  }

  S.data.projects.slice().reverse().forEach(function(p) {
    var tDay = p.days.find(function(d){return d.date===todayStr();});
    var tSt = getDayStatus(tDay);
    var isTracking = tSt!=="idle" && tSt!=="complete";
    var tBK = calcBreakdown(tDay, S.settings);
    var totalMin = p.days.filter(function(d){return d.workStart;}).reduce(function(acc,d){var b=calcBreakdown(d,S.settings);return acc+(b?b.total:0);},0);
    var c = div({"class":"card"+(isTracking?" card-on":""),style:{cursor:"pointer"}});
    c.addEventListener("click", function() { set({activeProjId:p.id, view:"project"}); });
    var inner = div({style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}});
    var left = div({style:{flex:"1"}});
    var nameRow = div({style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"10px"}});
    nameRow.appendChild(div({style:{fontSize:"16px",fontWeight:"700"}},[p.name]));
    if (isTracking||tSt==="complete") nameRow.appendChild(Badge(tSt,t));
    left.appendChild(nameRow);
    var stats = div({style:{display:"flex",gap:"20px"}});
    function addStat(label,val,color) {
      var s=div(null);
      s.appendChild(div({style:{marginBottom:"3px"}},[lbl(label)]));
      s.appendChild(div({"class":"mono",style:{fontSize:"20px",color:color||"#EEEEF5"}},[String(val)]));
      stats.appendChild(s);
    }
    addStat(t.days, p.days.filter(function(d){return d.workStart;}).length);
    addStat(t.total, fmtDur(totalMin), totalMin>0?"#5ED5B7":"rgba(238,238,245,0.38)");
    if (isTracking&&tBK) addStat(t.today, fmtDur(tBK.net), "#5ED5B7");
    left.appendChild(stats); inner.appendChild(left);
    var delBtn = btn({style:{background:"transparent",border:"none",color:"rgba(238,238,245,0.38)",fontSize:"20px",cursor:"pointer",padding:"0 0 0 8px"},"onClick":function(e){e.stopPropagation();set({confirmDelete:p.id});}},["×"]);
    inner.appendChild(delBtn); c.appendChild(inner); sec.appendChild(c);
  });

  if (S.showNewProj) {
    var np = div({"class":"card"});
    np.appendChild(div({style:{marginBottom:"10px"}},[lbl(t.createProject)]));
    var ni = inp({"class":"input-std",placeholder:t.projectName,value:S.newProjName||"",style:{marginBottom:"12px"}});
    ni.addEventListener("input",function(e){S.newProjName=e.target.value;});
    ni.addEventListener("keydown",function(e){if(e.key==="Enter"){createProj();}});
    var row=div({"class":"flex-row"});
    row.appendChild(Btn("g",t.cancel,function(){set({showNewProj:false,newProjName:""}); },{flex:"1"}));
    row.appendChild(Btn("p",t.create,createProj,{flex:"1"}));
    np.appendChild(ni); np.appendChild(row); sec.appendChild(np);
    setTimeout(function(){ni.focus();},50);
  } else {
    sec.appendChild(Btn("p",t.newProject,function(){set({showNewProj:true})},{width:"100%",fontSize:"15px"}));
  }
  root.appendChild(sec);
  return root;
}

function createProj() {
  if (!S.newProjName || !S.newProjName.trim()) return;
  var nd = Object.assign({},S.data,{projects:S.data.projects.concat([{id:uid(),name:S.newProjName.trim(),days:[],createdAt:todayStr()}])});
  persist(nd);
  set({showNewProj:false,newProjName:""});
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  var node;
  if (S.view==="settings") node = renderSettings();
  else if (S.editDay) node = renderEditDay();
  else if (S.view==="report" && S.activeProjId) node = renderReport();
  else if (S.view==="project" && S.activeProjId) node = renderProject();
  else node = renderProjects();
  var app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(node);
}

render();
</script>
</body>
</html>
